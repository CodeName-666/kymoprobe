[platformio]
default_envs = nodemcu-32s-development

[env:nodemcu-32s]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
; Conservative USB upload using the ESP32 ROM bootloader.
upload_speed = 57600
upload_flags = --no-stub
monitor_speed = 115200
lib_deps = KymoCore=symlink://lib/KymoCore
extra_scripts =
    pre:tools/kymo_profile_pre.py
    post:tools/kymo_profile_post.py

; Development and production use independent PlatformIO build directories.
[env:nodemcu-32s-development]
extends = env:nodemcu-32s
extra_scripts =
    pre:tools/kymo_profile_pre.py
    post:tools/kymo_profile_post.py

[env:nodemcu-32s-production]
extends = env:nodemcu-32s
extra_scripts =
    pre:tools/kymo_profile_pre.py
    post:tools/kymo_profile_post.py

[env:nodemcu-32s-network]
extends = env:nodemcu-32s
extra_scripts =
build_flags =
    -DKYMO_DEMO_NETWORK_ENABLE=1
    -DKYMO_ENABLE_TIMESTAMP=1
lib_deps =
    ${env:nodemcu-32s.lib_deps}
    knolleary/PubSubClient@2.8

; 256 channels at maximum transport throughput. No MQTT traffic.
[env:nodemcu-32s-stress-usb]
extends = env:nodemcu-32s
extra_scripts =
monitor_speed = 2000000
build_flags =
    -DKYMO_STRESS_ENABLE=1
    -DKYMO_STRESS_CHANNEL_COUNT=256
    -DKYMO_STRESS_PERIOD_MS=0
    -DKYMO_STRESS_BAUD=2000000
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_X=1
    -DKYMO_ENABLE_Z=1

[env:nodemcu-32s-stress-tcp]
extends = env:nodemcu-32s-stress-usb
monitor_speed = 115200
build_flags =
    ${env:nodemcu-32s-stress-usb.build_flags}
    -DKYMO_STRESS_TCP_ENABLE=1

; Largest supported wire frame: X, Y, Z and timestamp (21 bytes).
[env:nodemcu-32s-stress-tcp-xyz]
extends = env:nodemcu-32s-stress-tcp
build_flags =
    ${env:nodemcu-32s-stress-tcp.build_flags}
    -DKYMO_STRESS_XYZ_ENABLE=1
