[platformio]
default_envs = nodemcu-32s

; Change KYMO_DEMO_MODE in include/demo_selection.h for the default environment.
; Named environments override that selection reproducibly.
[env:nodemcu-32s]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
upload_speed = 57600
upload_flags = --no-stub
monitor_speed = 115200
lib_deps =
    symlink://lib/KymoCore
    knolleary/PubSubClient@2.8
build_flags = -I include -include demo_selection.h
extra_scripts =
    pre:tools/demo_profile_pre.py
    post:tools/kymo_profile_post.py

[env:nodemcu-32s-uart]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_UART

[env:nodemcu-32s-mqtt]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_MQTT

[env:nodemcu-32s-tcp]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_TCP

[env:nodemcu-32s-network]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_NETWORK

; Immutable configurator profiles for the original UART application.
[env:nodemcu-32s-development]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_GENERATED
extra_scripts =
    pre:tools/kymo_profile_pre.py
    post:tools/kymo_profile_post.py

[env:nodemcu-32s-production]
extends = env:nodemcu-32s-development

; Maximum throughput: 256 channels, no rate limiter and no MQTT traffic.
[env:nodemcu-32s-stress-usb]
extends = env:nodemcu-32s
monitor_speed = 2000000
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_MAX_USB

[env:nodemcu-32s-stress-tcp]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_MAX_TCP

[env:nodemcu-32s-stress-udp]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_MAX_UDP

[env:nodemcu-32s-stress-tcp-xyz]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_MAX_XYZ

[env:nodemcu-32s-features]
extends = env:nodemcu-32s
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_FEATURES

[env:nodemcu-32s-trace]
extends = env:nodemcu-32s
monitor_speed = 460800
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_TRACE
extra_scripts =
    pre:tools/probe_trace_pre.py
    post:tools/kymo_profile_post.py

[env:nodemcu-32s-trace-production]
extends = env:nodemcu-32s-trace

[env:nodemcu-32s-trace-flow]
extends = env:nodemcu-32s-trace
build_flags = ${env:nodemcu-32s.build_flags} -DKYMO_DEMO_MODE=KYMO_DEMO_TRACE_FLOW
