[platformio]
default_envs = esp32-stack-reserve

[env:esp32-stack-reserve]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../lib/KymoCore
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py
