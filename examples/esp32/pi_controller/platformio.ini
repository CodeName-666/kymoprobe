[platformio]
default_envs = esp32-pi-controller

; Needs the KymoCore back channel (KymoParam, 7.1).
[env:esp32-pi-controller]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../lib/KymoCore
build_flags =
    -DKYMO_ENABLE_TIMESTAMP=1
    -DKYMO_ENABLE_CRC=1
    -DKYMO_ENABLE_DECODER=1
    -DKYMO_ENABLE_PARAMETERS=1
extra_scripts = pre:../measurement_signals/tools/compiler_flags.py
