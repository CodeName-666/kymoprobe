[platformio]
default_envs = esp32-trace

[env:esp32-trace]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 460800
upload_speed = 57600
upload_flags = --no-stub
lib_deps = KymoCore=symlink://../../../lib/KymoCore
extra_scripts =
    pre:tools/trace_profile_pre.py
    post:tools/trace_profile_post.py
