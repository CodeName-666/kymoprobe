[env]
build_flags =
    -DPLOTTER_ENABLE_TIMESTAMP=1

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
    PlotterLib=symlink://../../../lib/PlotterLib
    knolleary/PubSubClient@^2.8
monitor_speed = 115200

[env:esp32-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    PlotterLib=symlink://../../../lib/PlotterLib
    knolleary/PubSubClient@^2.8
monitor_speed = 115200
